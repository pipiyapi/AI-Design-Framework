name: Validate design memory

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: node scripts/bootstrap-data.mjs --root "$RUNNER_TEMP/ai-design-data"
      - run: DESIGN_MEMORY_ROOT="$RUNNER_TEMP/ai-design-data" node scripts/build-catalog.mjs
      - run: DESIGN_MEMORY_ROOT="$RUNNER_TEMP/ai-design-data" node scripts/build-skill.mjs
